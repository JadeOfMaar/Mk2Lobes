@PART[mk2l-engsj]:NEEDS[StockWaterfallEffects]
{
	@EFFECTS
	{
		@running_closed
		{
			!MODEL_MULTI_PARTICLE,* {}
		}
		@running_open
		{
			!MODEL_MULTI_PARTICLE,* {}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = #$/MODULE[ModuleEnginesFX],0/engineID$
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = #$/MODULE[ModuleEnginesFX],0/engineID$
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			range = 0.7, 1
		}
		TEMPLATE
		{
			templateName = stock-methalox-lower-1
			// overrideParentTransform = thrustTransform
			scale = 0.8,0.5,0.8
			rotation = 0,0,0
			position = 0,0,0.15
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = #$/MODULE[ModuleEnginesFX],1/engineID$
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = #$/MODULE[ModuleEnginesFX],1/engineID$
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			range = 0.7, 1
		}
		TEMPLATE
		{
			templateName = stock-kerozine-afterburner-2
			// overrideParentTransform = thrustTransform
			scale = 0.8,0.5,0.8
			rotation = 0,0,0
			position = 0,0,0.15
		}
	}
}
